<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.lineicons.com/4.0/lineicons.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">

    <title>Double Slider Registration / Login</title>

</head>
<body>
    <!---- Form containers ---->
    <div class="container" id="container">
        <!---- Register Container ---->
        <div class="form-container register-container">
            <form action="#">
                <h1>Create Account</h1>
                <input type="text" placeholder="Username">
                <input type="email" placeholder="Email">
                <input type="password" placeholder="Password">
                <button type="button" id="registerbtn">Register</button>
                <span>or use your account</span>
                <div class="social-container">
                    <a href="#" class="social"><i class="lni lni-google"></i></a>
                    <a href="#" class="social"><i class="lni lni-twitter-original"></i></a>
                    <a href="#" class="social"><i class="lni lni-linkedin-original"></i></a>
                    <a href="#" class="social"><i class="lni lni-github-original"></i></a>
                </div>
            </form>
        </div>

        <!---- Login Container ---->
        <div class="form-container login-container">
            <form action="#">
                <h1>Sign In</h1>
                <input type="email" placeholder="Email">
                <input type="password" placeholder="Password">
                <div class="content">
                    <div class="checkbox">
                        <input type="checkbox" name="checkbox" id="checkbox">
                        <label>Remember Me</label>
                    </div>
                    <div class="pass-link">
                        <a href="#">Forgot Password</a>
                    </div>
                </div>
                <button type="button" id="loginbtn">Login</button>
                <span>or use your account</span>
                <div class="social-container">
                    <a href="#" class="social"><i class="lni lni-google"></i></a>
                    <a href="#" class="social"><i class="lni lni-twitter-original"></i></a>
                    <a href="#" class="social"><i class="lni lni-linkedin-original"></i></a>
                    <a href="#" class="social"><i class="lni lni-github-original"></i></a>
                </div>
            </form>
        </div>

        <!---- Overlays ---->
        <div class="overlay-container">
            <div class="overlay">
                 <!---- Overlay left panel ---->
                <div class="overlay-panel overlay-left">
                    <h1 class="title">Welcome, Back</h1>
                    <p>You know the drill. Login</p>
                    <button class="ghost" id="signinbtn">Sign In</button>
                    <div class="social-container">
                        <a href="#" class="social"><i class="lni lni-google"></i></a>
                        <a href="#" class="social"><i class="lni lni-twitter-original"></i></a>
                        <a href="#" class="social"><i class="lni lni-linkedin-original"></i></a>
                        <a href="#" class="social"><i class="lni lni-github-original"></i></a>
                    </div>
                </div>
                    <!---- Overlay right panel ---->
                <div class="overlay-panel overlay-right">
                    <h1>Hello, Stranger</h1>
                    <p>Enter the details to suffer-I mean, Sign Up</p>
                    <button class="ghost" id="signupbtn">Sign Up</button>
                    <div class="social-container">
                        <a href="#" class="social"><i class="lni lni-google"></i></a>
                        <a href="#" class="social"><i class="lni lni-twitter-original"></i></a>
                        <a href="#" class="social"><i class="lni lni-linkedin-original"></i></a>
                        <a href="#" class="social"><i class="lni lni-github-original"></i></a>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
